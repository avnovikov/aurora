name: Security & Compliance Scans
# Parity with HotspotTriage: SAST + deps + secrets. Aurora stack = JS/TS + Java (Capacitor).

on:
  push:
    branches: [main, poc]
  pull_request:
    branches: [main, poc]
  schedule:
    - cron: "0 2 * * 1" # Weekly Monday 2AM UTC

permissions:
  contents: read

jobs:
  security-scan:
    name: SAST + Dependencies + Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,java
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-gate:
    name: Security Gate (PR only)
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == "pull_request"
    permissions:
      contents: read
    steps:
      - name: Gate passed
        if: needs.security-scan.result == "success"
        run: echo "All security scans passed — safe to merge"
      - name: Gate failed
        if: needs.security-scan.result != "success"
        run: |
          echo "Security scans failed — merge blocked"
          exit 1
