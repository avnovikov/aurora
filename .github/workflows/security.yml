name: Security & Compliance Scans
# Parity with HotspotTriage: SAST + deps + secrets. Aurora stack = JS/TS + Java (Capacitor).

# PR gate: main / mvp / release only (branch rulesets). Push to dev is informational.
on:
  push:
    branches: [main, mvp, dev, "release/**"]
  pull_request:
    branches: [main, mvp, "release/**"]
  schedule:
    - cron: "0 2 * * 1" # Weekly Monday 2AM UTC

permissions:
  contents: read

jobs:
  security-scan:
    name: SAST + Dependencies + Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        # Ignores withdrawn picomatch GHSA-fc5q-39xc-vjpf (no patched release;
        # npm audit fix --force would wrongly downgrade vitest/vite).
        run: node scripts/npm-audit-high.mjs

      # Keep SAST / Trivy / secrets running even when audit fails so one red step
      # does not skip the rest of the security suite.
      - name: Initialize CodeQL
        if: success() || failure()
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,java
          build-mode: manual
          queries: security-and-quality

      # Manual Java build (not Autobuild): Autobuild's `./gradlew clean` intermittently
      # fails resolving AGP classpath deps from Maven Central, then CodeQL finalize
      # exits 32 with "detected Java/Kotlin but could not process any of it".
      # cordova.variables.gradle is generated by `cap sync` and gitignored.
      # ubuntu-latest already ships an Android SDK; avoid setup-android license fights.
      - name: Set up JDK 21
        if: success() || failure()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Capacitor sync Android
        if: success() || failure()
        run: |
          npm run build
          npx cap sync android

      - name: Build Android for CodeQL
        if: success() || failure()
        working-directory: android
        run: |
          set -euo pipefail
          attempts=3
          for i in $(seq 1 "$attempts"); do
            echo "Gradle assembleDebug attempt $i/$attempts"
            # --no-build-cache: CodeQL must observe a real compile, not FROM-CACHE.
            if ./gradlew --no-daemon --no-build-cache assembleDebug; then
              exit 0
            fi
            if [ "$i" -eq "$attempts" ]; then
              echo "Gradle assembleDebug failed after $attempts attempts"
              exit 1
            fi
            sleep_secs=$((i * 20))
            echo "Gradle build failed (attempt $i); retrying in ${sleep_secs}s..."
            sleep "$sleep_secs"
          done

      - name: Run CodeQL Analysis
        if: success() || failure()
        uses: github/codeql-action/analyze@v4

      - name: Run Trivy vulnerability scanner
        if: success() || failure()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Run Gitleaks secret scan
        if: success() || failure()
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-gate:
    name: Security Gate (PR only)
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Gate passed
        if: needs.security-scan.result == 'success'
        run: echo "All security scans passed — safe to merge"
      - name: Gate failed
        if: needs.security-scan.result != 'success'
        run: |
          echo "Security scans failed — merge blocked"
          exit 1
