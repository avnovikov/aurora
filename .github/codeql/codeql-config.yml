name: Aurora CodeQL
# security-and-quality alone omits kind: alert-suppression, so in-source
# `lgtm[...]` / `codeql[...]` comments never apply. Include AlertSuppression
# for JS and Java explicitly (see #203).
queries:
  - uses: security-and-quality
  - uses: codeql/javascript-queries:AlertSuppression.ql
  - uses: codeql/java-queries:AlertSuppression.ql
