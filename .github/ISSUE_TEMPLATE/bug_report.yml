name: Bug report
description: Something in Aurora is broken or wrong
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Security vulnerabilities go to [Security Advisories](https://github.com/avnovikov/aurora/security/advisories/new), not here.
  - type: input
    id: named_contributor
    attributes:
      label: Named contributor
      description: Person who owns this report (use-case / reason for filing).
      placeholder: "@handle or name"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: Actual behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      description: e.g. v0.1.1 or a git SHA
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android APK
        - Local web preview (dev only)
        - Other / unclear
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Logs, screenshots, device model — avoid pasting personal health data.
    validations:
      required: false
