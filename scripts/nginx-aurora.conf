# Example Nginx site for Aurora static Vite build.
# Install: /etc/nginx/sites-available/aurora → sites-enabled/
# Replace YOUR_DOMAIN before certbot.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /var/www/aurora;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# After: sudo certbot --nginx -d YOUR_DOMAIN
# Certbot will add a second server { listen 443 ssl; ... } block.